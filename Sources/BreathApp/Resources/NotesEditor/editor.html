<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: breath-note-resource:; font-src 'self' data:; connect-src 'none'"
    />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="editor.bundle.css" />
  </head>
  <body data-mode="wysiwyg" data-theme="github" data-appearance="light">
    <main id="editor" aria-label="Markdown 编辑器"></main>
    <textarea
      id="source"
      aria-label="Markdown 源码编辑器"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    ></textarea>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="editor.bundle.js"></script>
  </body>
</html>
